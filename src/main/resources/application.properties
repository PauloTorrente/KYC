# Carrega .env (local/dev) se existir; em producao (Render etc.) as env vars
# reais ja estao no ambiente e este import fica sem efeito (optional:).
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# ===== Pepper do hash de CPF (legado, tabela "cliente") =====
kyc.cpf.pepper=${KYC_CPF_PEPPER}

# ===== Autenticacao (login fixo) =====
kyc.auth.username=${KYC_AUTH_USERNAME:admin}
kyc.auth.password-hash=${KYC_AUTH_PASSWORD_HASH}

# ===== JWT =====
kyc.jwt.secret=${KYC_JWT_SECRET}
kyc.jwt.expiration-minutes=${KYC_JWT_EXPIRATION_MINUTES:480}

server.port=${SERVER_PORT:8080}

# ===== CORS (frontend Vite) =====
kyc.cors.allowed-origins=${KYC_CORS_ORIGINS:http://localhost:5173}

# ===== Cloudflare R2 (armazenamento dos documentos KYC - API compativel com S3) =====
# Credenciais NAO ficam aqui: gerar um R2 API Token em dash.cloudflare.com > R2 > Manage
# API Tokens e definir as variaveis de ambiente abaixo.
kyc.s3.bucket=${KYC_S3_BUCKET:}
kyc.s3.presigned-url-ttl-minutes=${KYC_S3_PRESIGNED_TTL_MINUTES:5}
kyc.r2.account-id=${CLOUDFLARE_R2_ACCOUNT_ID:}
kyc.r2.access-key-id=${CLOUDFLARE_R2_ACCESS_KEY_ID:}
kyc.r2.secret-access-key=${CLOUDFLARE_R2_SECRET_ACCESS_KEY:}

# ===== AWS Textract (OCR dos documentos) =====
# Continua na AWS de verdade (servico que so' existe la'). As credenciais sao passadas
# explicitamente (nao via cadeia padrao do SDK): em producao com env vars reais no
# processo ou IAM role, AWS_ACCESS_KEY_ID/SECRET podem ficar em branco que o SDK usa a
# cadeia padrao sozinho; em dev local via .env, isso nao basta (o .env so populate o
# Environment do Spring, nao as env vars do processo), entao preenchemos aqui.
kyc.textract.region=${AWS_REGION:us-east-1}
kyc.textract.access-key-id=${AWS_ACCESS_KEY_ID:}
kyc.textract.secret-access-key=${AWS_SECRET_ACCESS_KEY:}

# Upload de arquivos (documentos KYC)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ===== Verificacao adicional por IA (Claude/Anthropic) - segunda camada opcional sobre o OCR =====
# Chave NAO fica aqui: definir a variavel de ambiente ANTHROPIC_API_KEY (gerada em
# console.anthropic.com). Sem ela, o endpoint /verificar-ia responde 502 avisando que
# o recurso nao esta configurado; o resto do KYC funciona normalmente.
kyc.ia.anthropic.api-key=${ANTHROPIC_API_KEY:}
kyc.ia.anthropic.model=${ANTHROPIC_MODEL:claude-sonnet-5}
